[package]
name = "phosphorpulse"
version = "0.1.0"
edition = "2024"
description = "A configurable status-line renderer for coding agents"
license = "MIT"
repository = "https://github.com/twjohnwu/phosphorpulse"
homepage = "https://github.com/twjohnwu/phosphorpulse"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
ratatui = "0.29"
crossterm = "0.28"
toml_edit = "0.22"
plist = "1.7"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

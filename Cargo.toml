[package]
name = "phosphorpulse"
version = "0.0.1"
edition = "2024"
description = "A configurable status-line renderer for coding agents"
license = "MIT"
repository = "https://github.com/twjohnwu/phosphorpulse"
homepage = "https://github.com/twjohnwu/phosphorpulse"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
